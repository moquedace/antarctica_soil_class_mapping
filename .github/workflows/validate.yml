name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Syntax, links, and citation metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Parse public R scripts
        shell: Rscript {0}
        run: |
          files <- sort(list.files("scripts", pattern = "[.]R$", full.names = TRUE))
          invisible(lapply(files, parse))
          message("Parsed ", length(files), " public R scripts.")

      - name: Validate local documentation links
        run: python tools/check_local_links.py

      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
