<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Probability-driven soil mapping in Antarctica</title>
  <desc id="desc">An abstract Antarctic landscape connects ranked probability layers to uncertainty-aware soil mapping units.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071c2c"/><stop offset=".52" stop-color="#0b3448"/><stop offset="1" stop-color="#115b67"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eefcff"/><stop offset="1" stop-color="#a8dbe0"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c98752"/><stop offset=".5" stop-color="#d9b66f"/><stop offset="1" stop-color="#92b47a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001018" flood-opacity=".35"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#c7f3f1" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1440" height="520" rx="24" fill="url(#bg)"/><rect width="1440" height="520" rx="24" fill="url(#grid)"/>
  <g opacity=".28" fill="none" stroke="#8cd9d6" stroke-width="1.5"><path d="M0 92C170 46 280 135 446 92s303-53 474 6 340 63 520 5"/><path d="M0 124c153-45 292 37 441-8s303-45 476 12 341 56 523 8"/><path d="M0 158c169-45 291 30 452-12s293-38 465 18 345 47 523 1"/></g>
  <g transform="translate(70 70)">
    <rect width="760" height="380" rx="26" fill="#062334" fill-opacity=".72" stroke="#8cd9d6" stroke-opacity=".24"/>
    <text x="52" y="72" fill="#8cd9d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">OPEN RESEARCH · CATENA 273 (2026)</text>
    <text x="52" y="137" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="750"><tspan x="52">Probability-driven</tspan><tspan x="52" dy="56">soil mapping in Antarctica</tspan></text>
    <text x="52" y="264" fill="#cae8e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23"><tspan x="52">From ranked Random Forest predictions to</tspan><tspan x="52" dy="34">uncertainty-aware soil mapping units.</tspan></text>
    <g transform="translate(52 326)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="middle" fill="#dffbfa">
      <rect width="164" height="38" rx="19" fill="#8cd9d6" fill-opacity=".14" stroke="#8cd9d6" stroke-opacity=".5"/><text x="82" y="25">8 m resolution</text>
      <rect x="178" width="150" height="38" rx="19" fill="#8cd9d6" fill-opacity=".14" stroke="#8cd9d6" stroke-opacity=".5"/><text x="253" y="25">19 soil classes</text>
      <rect x="342" width="150" height="38" rx="19" fill="#8cd9d6" fill-opacity=".14" stroke="#8cd9d6" stroke-opacity=".5"/><text x="417" y="25">100 RF runs</text>
    </g>
  </g>
