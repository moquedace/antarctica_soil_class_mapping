  <text x="1370" y="486" text-anchor="end" fill="#a8dbe0" fill-opacity=".8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">SCORPAN · RANDOM FOREST · MAPPING UNITS</text>
</svg>
